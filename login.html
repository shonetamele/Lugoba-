<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Lugoba Miracle Center Church</title>
  <meta name="theme-color" content="#1b5a39">
  <link rel="stylesheet" href="css/miracle-theme.css">
</head>
<body>
<div class="topbar">
  <div class="container">
    <span class="license">Licensed Uganda-Based Organisation</span>
    <span><a href="index.html">← Back to Home</a></span>
  </div>
</div>
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="images/pastors-service.jpg" alt="" width="50" height="50">
      <span class="brand-text">
        <span class="brand-name">Lugoba Miracle Center</span>
        <span class="brand-tag">A Place of Love and Holiness</span>
      </span>
    </a>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="form-card">
      <h2>Welcome Back</h2>
      <p class="sub">Sign in to access your fellowship account</p>
      <div id="loginAlert"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
        </div>
      </form>
      <div class="or-divider">or</div>
      <button type="button" class="btn btn-google" id="btnGoogle" style="width:100%">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
        Continue with Google
      </button>
      <p class="form-note">
        New here? <a href="create-account.html">Create an account</a><br>
        <small style="opacity:.8">Demo admin: use any admin email listed in config + any password</small>
      </p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="margin-top:0;border:0">
      <span>© 2026 Lugoba Miracle Center Church</span>
    </div>
  </div>
</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  const alertBox = document.getElementById('loginAlert');
  function showAlert(msg, type) {
    alertBox.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await LMCC.signInEmail(email, password);
      showAlert('Signed in successfully. Redirecting…', 'success');
      setTimeout(() => location.href = 'index.html', 900);
    } catch (err) {
      showAlert(err.message || 'Sign-in failed', 'error');
    }
  });
  document.getElementById('btnGoogle').addEventListener('click', async () => {
    try {
      await LMCC.signInGoogle();
      location.href = 'index.html';
    } catch (err) {
      showAlert(err.message || 'Google sign-in failed', 'error');
    }
  });
</script>
</body>
</html>
